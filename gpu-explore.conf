[program:water_gpu_explore]
command=/opt/supervisor-scripts/water-gpu-explore.sh
directory=/workspace/water
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/workspace/water/logs/gpu-explore.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=3
redirect_stderr=true
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"

[program:water_gpu_lgbm_horizon_enhanced]
environment=PROC_NAME="%(program_name)s"
directory=/workspace/water
command=/opt/supervisor-scripts/water-gpu-lgbm-horizon-enhanced.sh
autostart=false
autorestart=false
startsecs=5
stdout_logfile=/workspace/water/logs/gpu-lgbm-horizon-enhanced.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=3
redirect_stderr=true
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"

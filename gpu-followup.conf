[program:water_gpu_followup]
command=/opt/supervisor-scripts/water-gpu-followup.sh
directory=/workspace/water
autostart=false
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/workspace/water/logs/gpu-followup.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=3
redirect_stderr=true
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"

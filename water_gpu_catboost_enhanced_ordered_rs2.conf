[program:water_gpu_catboost_enhanced_ordered_rs2]
directory=/workspace/water
command=/venv/main/bin/python -u /workspace/water/gpu_catboost_enhanced_ordered_rs2.py
autostart=false
autorestart=false
startsecs=2
stdout_logfile=/workspace/water/logs/gpu-catboost-enhanced-ordered-rs2.log
stderr_logfile=/workspace/water/logs/gpu-catboost-enhanced-ordered-rs2.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:water_gpu_pattern_cv_extra]
environment=PROC_NAME="%(program_name)s"
directory=/workspace/water
command=/opt/supervisor-scripts/water-gpu-pattern-cv-extra.sh
autostart=false
autorestart=false
startsecs=5
startretries=3
stdout_logfile=/workspace/water/logs/gpu-pattern-cv-extra.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=3
redirect_stderr=true
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"

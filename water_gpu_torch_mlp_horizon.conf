[program:water_gpu_torch_mlp_horizon]
environment=PROC_NAME="%(program_name)s"
directory=/workspace/water
command=/opt/supervisor-scripts/water-gpu-torch-mlp-horizon.sh
autostart=false
autorestart=false
startsecs=5
stdout_logfile=/workspace/water/logs/gpu-torch-mlp-horizon.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=3
redirect_stderr=true
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"

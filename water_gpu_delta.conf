[program:water_gpu_delta]
command=/opt/supervisor-scripts/water-gpu-delta.sh
directory=/workspace/water
autostart=false
autorestart=true
startsecs=5
stdout_logfile=/workspace/water/logs/gpu-delta.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=3
redirect_stderr=true
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"

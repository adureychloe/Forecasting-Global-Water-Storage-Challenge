[program:water_auto_promote]
command=/opt/supervisor-scripts/water-auto-promote.sh
directory=/workspace/water
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/workspace/water/logs/auto-promote.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"

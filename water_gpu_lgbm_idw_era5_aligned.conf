[program:water_gpu_lgbm_idw_era5_aligned]
directory=/workspace/water
command=/venv/main/bin/python -u /workspace/water/gpu_lgbm_idw_era5_aligned.py
autostart=false
autorestart=false
startsecs=2
stopasgroup=true

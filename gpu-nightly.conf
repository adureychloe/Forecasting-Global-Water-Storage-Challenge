[program:water_gpu_nightly]
command=/opt/supervisor-scripts/water-gpu-nightly.sh
directory=/workspace/water
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stdout_logfile=/workspace/water/logs/gpu-nightly.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=3
redirect_stderr=true
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"

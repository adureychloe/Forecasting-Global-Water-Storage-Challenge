[program:water_gpu_chain_watcher]
directory=/workspace/water
command=/opt/supervisor-scripts/water-gpu-chain-watcher.sh
autostart=true
autorestart=false
stdout_logfile=/workspace/water/logs/gpu-chain-watcher.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"

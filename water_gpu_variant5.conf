[program:water_gpu_variant5]
environment=PROC_NAME="%(program_name)s"
directory=/workspace/water
command=/opt/supervisor-scripts/water-gpu-horizon-variant5.sh
autostart=false
autorestart=true
startsecs=5
stdout_logfile=/workspace/water/logs/gpu-horizon-variant5.log
redirect_stderr=true
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=3
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"

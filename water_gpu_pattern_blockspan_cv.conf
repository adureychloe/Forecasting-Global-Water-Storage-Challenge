[program:water_gpu_pattern_blockspan_cv]
directory=/workspace/water
command=/venv/main/bin/python -u /workspace/water/gpu_pattern_blockspan_cv.py
autostart=false
autorestart=false
startsecs=2
stdout_logfile=/workspace/water/logs/gpu-pattern-blockspan-cv.log
stderr_logfile=/workspace/water/logs/gpu-pattern-blockspan-cv.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:water_gpu_catboost_enhanced_ordered_loccat]
directory=/workspace/water
command=/venv/main/bin/python -u /workspace/water/gpu_catboost_enhanced_ordered_loccat.py
autostart=false
autorestart=false
startsecs=2
stdout_logfile=/workspace/water/logs/gpu-catboost-enhanced-ordered-loccat.log
stderr_logfile=/workspace/water/logs/gpu-catboost-enhanced-ordered-loccat.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:water_gpu_aligned_search_queue]
directory=/workspace/water
command=/venv/main/bin/python -u /workspace/water/gpu_aligned_search_queue.py
autostart=false
autorestart=false
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/water/logs/gpu-aligned-search-queue.log
stderr_logfile=/workspace/water/logs/gpu-aligned-search-queue.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

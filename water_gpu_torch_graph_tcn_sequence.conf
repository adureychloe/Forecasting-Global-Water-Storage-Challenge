[program:water_gpu_torch_graph_tcn_sequence]
directory=/workspace/water
command=/venv/main/bin/python -u /workspace/water/gpu_torch_graph_tcn_sequence.py
autostart=false
autorestart=false
startsecs=2
stdout_logfile=/workspace/water/logs/gpu-torch-graph-tcn-sequence.log
stderr_logfile=/workspace/water/logs/gpu-torch-graph-tcn-sequence.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

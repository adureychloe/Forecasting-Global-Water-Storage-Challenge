[program:water_gpu_after_neighborhood_watcher]
directory=/workspace/water
command=/venv/main/bin/python -u /workspace/water/gpu_after_neighborhood_watcher.py
autostart=false
autorestart=false
startsecs=1
stdout_logfile=/workspace/water/logs/gpu-after-neighborhood-watcher.log
stderr_logfile=/workspace/water/logs/gpu-after-neighborhood-watcher.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

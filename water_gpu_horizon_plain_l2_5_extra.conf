[program:water_gpu_horizon_plain_l2_5_extra]
environment=PROC_NAME="%(program_name)s"
directory=/workspace/water
command=/opt/supervisor-scripts/water-gpu-horizon-plain-l2-5-extra.sh
autostart=false
autorestart=false
startsecs=5
startretries=3
stdout_logfile=/workspace/water/logs/gpu-horizon-plain-l2-5-extra.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=3
redirect_stderr=true
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1"

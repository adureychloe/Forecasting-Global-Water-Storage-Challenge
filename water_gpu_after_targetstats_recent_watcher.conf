[program:water_gpu_after_targetstats_recent_watcher]
directory=/workspace/water
command=/venv/main/bin/python -u /workspace/water/gpu_after_targetstats_recent_watcher.py
autostart=false
autorestart=false
startsecs=2
stdout_logfile=/workspace/water/logs/gpu-after-targetstats-recent-watcher.log
stderr_logfile=/workspace/water/logs/gpu-after-targetstats-recent-watcher.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"
